<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Glowup Asia 2025 v6</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2D1B3D;--plum2:#3D2550;--cream:#F9F3E8;--cream2:#F0E6D0;
  --gold:#C9856A;--gold2:#E8A882;--text:#1A0F2E;--text2:#5C4A6E;--text3:#9B86B0;
  --surface:#fff;--border:rgba(45,27,61,0.1);--r:14px;--r-sm:9px;
  --shadow:0 2px 12px rgba(45,27,61,0.08);
  --seoul:#7C6FD4;--seoul-l:#EDEAFF;--seoul-d:#3B3175;
  --busan:#2E9E82;--busan-l:#E0F5EE;--busan-d:#0D5E4A;
  --jeju:#D4694A;--jeju-l:#FDEEE8;--jeju-d:#7A2E14;
  --taipei:#4A90D4;--taipei-l:#E8F2FC;--taipei-d:#1A4A7A;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
/* Header */
.hdr{background:var(--plum);padding:16px 16px 0;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.logo{font-family:"Playfair Display",serif;font-size:20px;color:#fff;}
.logo em{font-style:italic;color:var(--gold2);}
.hdr-btns{display:flex;gap:6px;}
.hbtn{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;border:none;white-space:nowrap;}
.hbtn-ghost{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);}
.hbtn-ai{background:linear-gradient(135deg,var(--gold),#E8937A);color:white;box-shadow:0 2px 8px rgba(201,133,106,0.4);}
.hbtn-key{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);}
.hbtn-key.active{background:rgba(46,158,130,0.3);color:#7FFFD4;}
/* Route ribbon */
.route{display:flex;align-items:center;background:rgba(255,255,255,0.06);border-radius:10px 10px 0 0;padding:12px 14px;}
.rcity{display:flex;flex-direction:column;align-items:center;flex:1;}
.rcity-name{font-size:11px;font-weight:700;color:rgba(255,255,255,0.9);}
.rcity-nights{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px;}
.rdot{width:7px;height:7px;border-radius:50%;margin-bottom:3px;}
.rline{flex:1;height:1px;background:rgba(255,255,255,0.2);margin:0 4px;align-self:center;margin-bottom:12px;}
.ryvr{font-size:10px;color:rgba(255,255,255,0.3);font-weight:600;}
/* AI Panel */
.ai-panel{background:var(--plum2);display:none;}
.ai-panel.open{display:block;}
.ai-log{height:180px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.chat-user{align-self:flex-end;background:var(--gold);color:white;padding:7px 11px;border-radius:12px 12px 2px 12px;font-size:13px;max-width:82%;line-height:1.5;}
.chat-ai{align-self:flex-start;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.9);padding:7px 11px;border-radius:12px 12px 12px 2px;font-size:13px;max-width:88%;line-height:1.6;}
.ai-input-row{display:flex;gap:7px;padding:9px 12px;border-top:1px solid rgba(255,255,255,0.08);}
.ai-input-row input{flex:1;padding:8px 11px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;font-size:13px;outline:none;font-family:Inter,sans-serif;}
.ai-input-row input:focus{border-color:var(--gold);}
.ai-send{background:var(--gold);color:white;border:none;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;}
/* Allocator */
.alloc{background:var(--surface);margin:12px;border-radius:var(--r);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);}
.alloc-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:11px;}
.nights-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-bottom:12px;}
.nbs{height:100%;transition:flex 0.3s;}
.city-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.clabel{font-size:13px;font-weight:600;flex:1;}
.cdates{font-size:11px;color:var(--text3);min-width:85px;}
.nctrl{display:flex;align-items:center;gap:6px;}
.nbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.nbtn:disabled{opacity:0.2;cursor:not-allowed;}
.nnum{font-size:15px;font-weight:700;min-width:20px;text-align:center;}
.nlbl{font-size:10px;color:var(--text3);text-align:center;}
.warn{border-radius:var(--r-sm);padding:8px 10px;font-size:12px;margin-top:5px;display:none;}
/* Tabs */
.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);}
.tabs{display:flex;gap:7px;padding:11px 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.ctab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 14px;border-radius:11px;border:2px solid transparent;cursor:pointer;min-width:65px;background:var(--cream);flex-shrink:0;font-family:Inter,sans-serif;}
.ctab-emoji{font-size:17px;}
.ctab-name{font-size:12px;font-weight:700;}
.ctab-sub{font-size:10px;opacity:0.55;}
.ctab.active{border-color:var(--plum);background:#fff;}
/* Sections */
.sec{display:none;padding:11px 12px 36px;}
.sec.active{display:block;}
.sec-hero{border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;}
.sec-hero h2{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;margin-bottom:3px;}
.sec-hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hood-btn{font-size:11px;background:var(--gold);color:white;border:none;border-radius:20px;padding:4px 11px;cursor:pointer;font-family:Inter,sans-serif;font-weight:700;}
.hood-form{background:#fff;border:2px solid var(--gold);border-radius:11px;padding:14px;margin-top:11px;display:none;}
.hood-form input{width:100%;padding:11px 12px;font-size:15px;border:2px solid var(--gold);border-radius:8px;margin-bottom:9px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;}
.hood-picks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.hood-pick{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--cream);cursor:pointer;font-family:Inter,sans-serif;}
.hood-save{width:100%;padding:10px;background:var(--plum);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}
.weather-chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
.wchip{font-size:11px;background:rgba(255,255,255,0.25);padding:3px 9px;border-radius:20px;}
.transport{font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:11px;color:var(--text2);line-height:1.6;}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.day-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.cat-pill{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;}
.cat-pill.wellness{background:#fdf4ff;color:#7e22ce;}
.cat-pill.food{background:#fff7ed;color:#c2410c;}
.cat-pill.culture{background:#eff6ff;color:#1d4ed8;}
.cat-pill.shopping{background:#f0fdf4;color:#15803d;}
.cat-pill.nature{background:#f0fdfa;color:#0f766e;}
.cat-pill.relaxed{background:#f8f7f5;color:#5C4A6E;}
.card h3{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:5px;}
.card p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px;}
.tip{font-size:12px;color:var(--text3);background:var(--cream);border-radius:var(--r-sm);padding:7px 10px;line-height:1.5;margin-bottom:8px;}
.rest-box{margin-top:8px;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:9px 11px;}
.rest-box-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.rest-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.rest-dish{font-size:12px;color:#c2410c;margin-bottom:3px;}
.rest-tip{font-size:11px;color:#92400e;line-height:1.5;}
.mw-badge{font-size:10px;font-weight:700;background:#fef9c3;color:#856404;padding:2px 7px;border-radius:20px;border:1px solid #fde047;}
.srow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;}
.slbl{font-size:11px;color:var(--text3);}
.sbtn{font-size:12px;padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;color:var(--text2);}
.sbtn.confirmed{background:#dcfce7;color:#15803d;border-color:#86efac;}
.sbtn.maybe{background:#fef9c3;color:#92400e;border-color:#fde047;}
.sbtn.skip{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
.ai-suggest-btn{width:100%;margin-top:8px;padding:7px;background:rgba(124,111,212,0.07);border:1.5px dashed rgba(124,111,212,0.35);border-radius:var(--r-sm);font-size:12px;font-weight:600;color:#7C6FD4;cursor:pointer;font-family:Inter,sans-serif;}
.more-note{text-align:center;padding:10px;color:var(--text3);font-size:12px;font-style:italic;}
/* Override restaurant */
.rest-override{margin-top:6px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:7px 10px;font-size:12px;color:#14532d;}
.rest-add-btn{margin-top:5px;width:100%;padding:6px;background:none;border:1px dashed #86efac;border-radius:7px;font-size:11px;font-weight:600;color:#15803d;cursor:pointer;font-family:Inter,sans-serif;}
.rest-inp-row{display:flex;gap:5px;margin-top:5px;}
.rest-inp-row input{flex:1;padding:7px 9px;border:1.5px solid #86efac;border-radius:7px;font-size:13px;font-family:Inter,sans-serif;outline:none;}
.rest-save-btn{padding:7px 11px;background:#15803d;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;}
/* Logistics */
.log-group{margin-bottom:14px;}
.log-group h3{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;}
.log-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:5px;display:flex;gap:10px;}
.lstat{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
.lstat.confirmed{background:#dcfce7;color:#15803d;}
.lstat.to-book{background:#fef9c3;color:#92400e;}
.lstat.to-do{background:#e0e7ff;color:#4338ca;}
.lbody h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.lbody p{font-size:12px;color:var(--text2);line-height:1.5;}
.lbody small{font-size:11px;color:var(--text3);}
/* Packing */
.pack-group{margin-bottom:14px;}
.pack-group h3{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;}
.pack-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:5px;cursor:pointer;}
.pack-check{width:19px;height:19px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.pack-check.done{background:var(--plum);border-color:var(--plum);color:white;}
.pack-label{font-size:13px;flex:1;}
.pack-item.done .pack-label{color:var(--text3);text-decoration:line-through;}
.pack-tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--cream2);color:var(--text3);font-weight:600;}
/* Bookings */
.book-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.book-header{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.book-icon{font-size:20px;}
.book-title{font-size:14px;font-weight:700;}
.book-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.book-status{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.book-status.booked{background:#dcfce7;color:#15803d;}
.book-status.pending{background:#fef9c3;color:#92400e;}
.field-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.field{flex:1;min-width:110px;}
.field label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:3px;}
.field input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:Inter,sans-serif;background:var(--cream);outline:none;color:var(--text);}
.field input:focus{border-color:var(--gold);}
.book-save-btn{width:100%;padding:9px;background:var(--plum);color:#fff;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;margin-top:8px;}
.book-ai-btn{width:100%;margin-top:6px;padding:8px;background:rgba(124,111,212,0.08);border:1.5px dashed rgba(124,111,212,0.4);border-radius:var(--r-sm);font-size:12px;font-weight:600;color:#7C6FD4;cursor:pointer;font-family:Inter,sans-serif;}
.add-book-btn{width:100%;padding:13px;background:rgba(124,111,212,0.06);border:2px dashed rgba(124,111,212,0.3);border-radius:var(--r);font-size:14px;font-weight:700;color:#7C6FD4;cursor:pointer;font-family:Inter,sans-serif;margin-top:7px;}
/* Share */
.share-card{background:var(--plum);border-radius:var(--r);padding:22px;text-align:center;}
.share-card h2{font-family:"Playfair Display",serif;font-size:20px;color:#fff;margin-bottom:4px;}
.share-card p{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px;}
.share-route{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.share-city{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;color:white;}
.share-btn{background:var(--gold);color:white;border:none;border-radius:var(--r-sm);padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;width:100%;}
/* Weather */
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.weather-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;}
.weather-city{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:7px;}
.weather-temp{font-family:"Playfair Display",serif;font-size:26px;font-weight:700;}
.weather-feel{font-size:12px;color:var(--text2);margin-top:3px;}
/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(45,27,61,0.55);z-index:9999;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.modal-box{background:#fff;border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:34px;height:4px;border-radius:2px;background:#e5e7eb;margin:0 auto 14px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.modal-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-family:Inter,sans-serif;outline:none;margin-bottom:8px;}
.modal-input:focus{border-color:var(--gold);}
.modal-textarea{width:100%;height:75px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:Inter,sans-serif;outline:none;resize:none;margin-bottom:8px;}
.modal-textarea:focus{border-color:var(--seoul);}
.mbtn-row{display:flex;gap:7px;}
.mbtn-primary{flex:1;background:var(--plum);color:#fff;border:none;border-radius:var(--r-sm);padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}
.mbtn-secondary{background:var(--cream);color:var(--text2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;}
/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.25s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
/* Floating AI btn */
#floatAI{position:fixed;bottom:22px;right:18px;z-index:200;background:linear-gradient(135deg,var(--gold),#E8937A);color:#fff;border:none;border-radius:26px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;box-shadow:0 4px 16px rgba(201,133,106,0.45);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">✨ <em>Glowup</em> Asia</div>
    <div class="hdr-btns">
      <button class="hbtn hbtn-key" id="keyBtn" onclick="openKeyModal()">🔑</button>
      
      <button class="hbtn hbtn-ai" onclick="toggleAI()">✨ Ask AI</button>
    </div>
  </div>
  <div class="route" id="route">
    <span class="ryvr">YVR</span>
    <div class="rline"></div>
    <div class="rcity"><div class="rdot" style="background:var(--seoul)"></div><div class="rcity-name">Seoul</div><div class="rcity-nights" id="rn-Seoul">6n</div></div>
    <div class="rline"></div>
    <div class="rcity"><div class="rdot" style="background:var(--busan)"></div><div class="rcity-name">Busan</div><div class="rcity-nights" id="rn-Busan">3n</div></div>
    <div class="rline"></div>
    <div class="rcity"><div class="rdot" style="background:var(--jeju)"></div><div class="rcity-name">Jeju</div><div class="rcity-nights" id="rn-Jeju">4n</div></div>
    <div class="rline"></div>
    <div class="rcity"><div class="rdot" style="background:var(--taipei)"></div><div class="rcity-name">Taipei</div><div class="rcity-nights" id="rn-Taipei">5n</div></div>
    <div class="rline"></div>
    <span class="ryvr">YVR</span>
  </div>
</div>

<!-- AI PANEL -->
<div class="ai-panel" id="aiPanel">
  <div class="ai-log" id="aiLog">
    <div class="chat-ai">Hi! I know your full itinerary. Ask me anything — best day for skin treatments, what to eat, whether to swap an activity. ✨</div>
  </div>
  <div class="ai-input-row">
    <input id="aiInput" type="text" placeholder="Ask anything about your trip…" onkeydown="if(event.key==='Enter')askAI()"/>
    <button class="ai-send" onclick="askAI()">Send</button>
  </div>
</div>

<!-- SYNC PANEL -->
<div style="background:#f0fdf4;border-bottom:1px solid #86efac;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
  <span id="sdot" style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0;"></span>
  <span id="slbl" style="font-size:12px;color:var(--text2);flex:1;">Ready to sync</span>
  <button onclick="pushToSheet()" style="font-size:11px;font-weight:700;padding:4px 12px;background:#2d1b3d;color:white;border:none;border-radius:20px;cursor:pointer;">⬆ Push my changes</button>
  <button onclick="pullFromSheet()" style="font-size:11px;font-weight:700;padding:4px 12px;background:#2E9E82;color:white;border:none;border-radius:20px;cursor:pointer;">⬇ Pull latest</button>
</div>

<!-- ALLOCATOR -->
<div class="alloc">
  <div class="alloc-title">Night allocation — 18 nights total</div>
  <div class="nights-bar" id="nbar"></div>
  <div id="cityRows"></div>
  <div class="warn" id="warn"></div>
</div>

<!-- TABS -->
<div class="tabs-wrap"><div class="tabs" id="ctabs"></div></div>

<!-- SECTIONS -->
<div id="secs"></div>

<!-- FLOATING AI -->
<button id="floatAI" onclick="toggleAI()">✨ Ask AI</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const TOTAL = 18;
const CITIES = ['Seoul','Busan','Jeju','Taipei'];
const C = {
  Seoul:  {color:'#7C6FD4',light:'#EDEAFF',dark:'#3B3175',emoji:'🇰🇷'},
  Busan:  {color:'#2E9E82',light:'#E0F5EE',dark:'#0D5E4A',emoji:'🌊'},
  Jeju:   {color:'#D4694A',light:'#FDEEE8',dark:'#7A2E14',emoji:'🌋'},
  Taipei: {color:'#4A90D4',light:'#E8F2FC',dark:'#1A4A7A',emoji:'🏮'},
};
const WEATHER = {
  Seoul:  {temp:'24–27°C',sun:'High',rain:'Low',note:'Warm and clear. One of the best months to visit.'},
  Busan:  {temp:'25–27°C',sun:'High',rain:'Low',note:'Blue skies, great for beaches.'},
  Jeju:   {temp:'25–28°C',sun:'High',rain:'Low',note:'Ideal hiking and outdoor weather.'},
  Taipei: {temp:'28–32°C',sun:'Med', rain:'Med',note:'Warm and humid, afternoon showers possible. Bring umbrella.'},
};
const TRANSPORT = {
  Seoul:  '✈️ Arrive Incheon ICN ~11.5 hr from YVR. AREX express → Seoul Station (43 min) → taxi to your neighbourhood.',
  Busan:  '🚄 KTX bullet train Seoul Station → Busan Station ~2h 15min. Book 1 month ahead on Korail.com.',
  Jeju:   '✈️ Domestic flight Busan PUS → Jeju CJU (~55 min). Pick up rental car at Jeju Airport.',
  Taipei: "✈️ Flight Jeju CJU → Taipei TPE (~2.5 hrs). Airport MRT to Da-an district (~35 min).",
};
const HOODS_SUGGESTIONS = {
  Seoul:  ['Seochon','Insadong','Hongdae','Gangnam','Myeongdong','Itaewon','Bukchon'],
  Busan:  ['Seomyeon','Haeundae','Nampo-dong','Gwangalli'],
  Jeju:   ['Seogwipo','Jeju City','Jungmun','Aewol'],
  Taipei: ['Da-an','Zhongzheng','Xinyi','Zhongshan','Wanhua'],
};
const TABS = [
  {id:'Seoul',   emoji:'🇰🇷',label:'Seoul',   sub:'nights'},
  {id:'Busan',   emoji:'🌊',label:'Busan',   sub:'nights'},
  {id:'Jeju',    emoji:'🌋',label:'Jeju',    sub:'nights'},
  {id:'Taipei',  emoji:'🏮',label:'Taipei',  sub:'nights'},
  {id:'bookings',emoji:'📋',label:'Bookings',sub:'& flights'},
  {id:'logistics',emoji:'✅',label:'Logistics',sub:'to-do'},
  {id:'packing', emoji:'🧳',label:'Packing',  sub:'checklist'},
  {id:'weather',  emoji:'🌤',label:'Weather',  sub:'September'},
  {id:'share',    emoji:'💌',label:'Share',    sub:'trip card'},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
var state = {
  nights: {Seoul:6,Busan:3,Jeju:4,Taipei:5},
  hoods:  {Seoul:null,Busan:null,Jeju:null,Taipei:null},
  statuses: {},
  bookings: {},
  packing: {},
  restaurantOverrides: {},
  arrivalOverrides: {},
  activeTab: 'Seoul',
  sheetId: null,
};

function saveState(){
  try{ localStorage.setItem('glowup_v6', JSON.stringify(state)); }catch(e){}
}
function loadState(){
  // Clear any old version data
  ['glowup_v3','glowup_v4','glowup_v5','glowup_custom_acts','glowup_sheet_id'].forEach(function(k){
    localStorage.removeItem(k);
  });
  try{
    var s = JSON.parse(localStorage.getItem('glowup_v6')||'{}');
    if(s.nights) state.nights = s.nights;
    if(s.hoods)  state.hoods  = s.hoods;
    if(s.statuses) state.statuses = s.statuses;
    if(s.bookings) state.bookings = s.bookings;
    if(s.packing)  state.packing  = s.packing;
    if(s.restaurantOverrides) state.restaurantOverrides = s.restaurantOverrides;
    if(s.arrivalOverrides)    state.arrivalOverrides    = s.arrivalOverrides;
    if(s.activeTab) state.activeTab = s.activeTab;
    if(s.sheetId)   state.sheetId   = s.sheetId;
  }catch(e){}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function totalN(){ return Object.values(state.nights).reduce(function(a,b){return a+b;},0); }
function fmt(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function computeDates(){
  var start = new Date(2025,8,7); var off = 0; var out = {};
  CITIES.forEach(function(c){
    var s = new Date(start); s.setDate(s.getDate()+off);
    var e = new Date(s); e.setDate(e.getDate()+state.nights[c]);
    out[c]={start:s,end:e}; off+=state.nights[c];
  });
  return out;
}
function getStatus(city,p){ return state.statuses[city+'-'+p]||'confirmed'; }

var toastTimer;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2200);
}

// ── RENDER ALLOCATOR ──────────────────────────────────────────────────────────
function renderAlloc(){
  var dates = computeDates();
  var bar = document.getElementById('nbar');
  if(!bar) return;
  bar.innerHTML = '';
  CITIES.forEach(function(c){
    var s = document.createElement('div');
    s.className='nbs'; s.style.flex=state.nights[c]; s.style.background=C[c].color;
    bar.appendChild(s);
  });
  var rows = document.getElementById('cityRows');
  rows.innerHTML = '';
  CITIES.forEach(function(c){
    var d = dates[c];
    var row = document.createElement('div');
    row.className = 'city-row';
    row.innerHTML = '<div class="cdot" style="background:'+C[c].color+'"></div>'
      +'<div class="clabel">'+C[c].emoji+' '+c+'</div>'
      +'<div class="cdates">'+fmt(d.start)+' – '+fmt(d.end)+'</div>'
      +'<div class="nctrl">'
      +'<button class="nbtn" id="btn-minus-'+c+'" onclick="adj(this.dataset.city,-1)" data-city="'+c+'">−</button>'
      +'<div><div class="nnum">'+state.nights[c]+'</div><div class="nlbl">nights</div></div>'
      +'<button class="nbtn" id="btn-plus-'+c+'" onclick="adj(this.dataset.city,1)" data-city="'+c+'">+</button>'
      +'</div>';
    rows.appendChild(row);
    // update route ribbon
    var rn = document.getElementById('rn-'+c);
    if(rn) rn.textContent = state.nights[c]+'n';
  });
  // Disable buttons
  CITIES.forEach(function(c){
    var bm = document.getElementById('btn-minus-'+c);
    var bp = document.getElementById('btn-plus-'+c);
    if(bm) bm.disabled = state.nights[c] <= 1;
    if(bp) bp.disabled = totalN() >= TOTAL;
  });
  var used = totalN();
  var warn = document.getElementById('warn');
  if(used > TOTAL){
    warn.style.cssText='display:block;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:7px 10px;font-size:12px;margin-top:5px;';
    warn.textContent='⚠️ '+used+' nights allocated, only '+TOTAL+' available.';
  } else if(used < TOTAL){
    warn.style.cssText='display:block;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:8px;padding:7px 10px;font-size:12px;margin-top:5px;';
    warn.textContent='ℹ️ '+(TOTAL-used)+' night'+(TOTAL-used>1?'s':'')+' left to assign.';
  } else {
    warn.style.display='none';
  }
}

function adj(city, delta){
  var nv = state.nights[city]+delta;
  if(nv<1||(delta>0&&totalN()>=TOTAL)) return;
  state.nights[city]=nv;
  saveState();
  renderAlloc();
  renderSecs();
  toast(city+': '+state.nights[city]+' nights');
}

// ── RENDER TABS ───────────────────────────────────────────────────────────────
function renderTabs(){
  var wrap = document.getElementById('ctabs');
  if(!wrap) return;
  wrap.innerHTML = '';
  TABS.forEach(function(t){
    var btn = document.createElement('button');
    btn.className = 'ctab'+(state.activeTab===t.id?' active':'');
    btn.style.fontFamily = 'Inter,sans-serif';
    var sub = CITIES.indexOf(t.id)>=0 ? state.nights[t.id]+' nights' : t.sub;
    btn.innerHTML = '<div class="ctab-emoji">'+t.emoji+'</div>'
      +'<div class="ctab-name">'+t.label+'</div>'
      +'<div class="ctab-sub">'+sub+'</div>';
    btn.onclick = function(){
      state.activeTab = t.id;
      saveState();
      renderTabs();
      document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active');});
      var el = document.getElementById('sec-'+t.id);
      if(el) el.classList.add('active');
    };
    wrap.appendChild(btn);
  });
}

// ── RENDER SECTIONS ───────────────────────────────────────────────────────────
var SLOT_ORDER = {Morning:0,Afternoon:1,Evening:2,'Full day':1};

function renderSecs(){
  var container = document.getElementById('secs');
  if(!container) return;
  container.innerHTML = '';
  var dates = computeDates();

  // City sections
  CITIES.forEach(function(city){
    var div = document.createElement('div');
    div.className = 'sec'+(state.activeTab===city?' active':'');
    div.id = 'sec-'+city;
    var w = WEATHER[city];
    var confirmedHood = state.hoods[city];

    // Hero
    var hero = document.createElement('div');
    hero.className = 'sec-hero';
    hero.style.cssText = 'background:'+C[city].light+';color:'+C[city].dark+';';
    var h2 = document.createElement('h2');
    h2.style.color = C[city].dark;
    h2.textContent = C[city].emoji+' '+city;
    hero.appendChild(h2);
    var meta = document.createElement('div');
    meta.className = 'sec-hero-meta';
    meta.innerHTML = '<span style="font-size:12px;font-weight:600;opacity:0.7;">'+state.nights[city]+' nights</span>'
      +'<span style="opacity:0.3">·</span>';
    if(confirmedHood){
      meta.innerHTML += '<span style="font-size:12px;">📍 '+confirmedHood+'</span>'
        +'<button class="hood-btn" onclick="toggleHoodForm(this.dataset.city)" data-city="'+city+'" style="background:none;color:'+C[city].dark+';border:1px solid currentColor;opacity:0.6;">edit</button>';
    } else {
      meta.innerHTML += '<button class="hood-btn" onclick="toggleHoodForm(this.dataset.city)" data-city="'+city+'">📍 Add neighbourhood</button>';
    }
    hero.appendChild(meta);
    var wchips = document.createElement('div');
    wchips.className = 'weather-chips';
    wchips.innerHTML = '<span class="wchip">🌡 '+w.temp+'</span><span class="wchip">☀️ '+w.sun+' sun</span><span class="wchip">🌧 '+w.rain+' rain</span>';
    hero.appendChild(wchips);
    div.appendChild(hero);

    // Hood form (hidden by default)
    var hoodForm = document.createElement('div');
    hoodForm.className = 'hood-form';
    hoodForm.id = 'hood-form-'+city;
    var hoodInp = document.createElement('input');
    hoodInp.type = 'text';
    hoodInp.id = 'hood-inp-'+city;
    hoodInp.placeholder = 'Neighbourhood or hotel area...';
    hoodInp.value = confirmedHood||'';
    hoodInp.addEventListener('keydown',function(e){if(e.key==='Enter')saveHood(city);});
    hoodForm.appendChild(hoodInp);
    var picks = document.createElement('div');
    picks.className = 'hood-picks';
    (HOODS_SUGGESTIONS[city]||[]).forEach(function(s){
      var b = document.createElement('button');
      b.className = 'hood-pick';
      b.textContent = s;
      b.onclick = function(){hoodInp.value=s;};
      picks.appendChild(b);
    });
    hoodForm.appendChild(picks);
    var saveHoodBtn = document.createElement('button');
    saveHoodBtn.className = 'hood-save';
    saveHoodBtn.textContent = 'Save neighbourhood';
    saveHoodBtn.onclick = function(){saveHood(city);};
    hoodForm.appendChild(saveHoodBtn);
    div.appendChild(hoodForm);

    // Transport
    var trans = document.createElement('div');
    trans.className = 'transport';
    trans.textContent = TRANSPORT[city];
    div.appendChild(trans);

    // Activities
    var acts = ACTIVITIES.filter(function(a){return a.city===city;})
      .sort(function(a,b){
        var dA=Math.floor((a.p-1)/3), dB=Math.floor((b.p-1)/3);
        if(dA!==dB) return dA-dB;
        return (SLOT_ORDER[a.slot]||1)-(SLOT_ORDER[b.slot]||1);
      });
    var n = state.nights[city];

    // Apply arrival override - pick correct slots for Day 1
    var arrOvr = state.arrivalOverrides && state.arrivalOverrides[city];
    var shown;
    if(arrOvr && arrOvr.day1Slots){
      // Get all Day 1 activities (p:1,2,3) sorted by slot order
      var day1All = acts.filter(function(a){ return Math.floor((a.p-1)/3) === 0; });
      // Take only the LAST N slots (e.g. evening-only = last 1, afternoon+evening = last 2)
      var day1 = day1All.slice(day1All.length - arrOvr.day1Slots);
      // Get remaining days normally
      var rest = acts.filter(function(a){ return Math.floor((a.p-1)/3) > 0; })
                     .slice(0, (n-1)*3);
      shown = day1.concat(rest);
    } else {
      shown = acts.slice(0, Math.min(n*3, acts.length));
    }
    var dropped = acts.length - shown.length;
    var cityStartDate = dates[city].start;

    // Build day number map based on actual structure
    var dayNums = [];
    if(arrOvr && arrOvr.day1Slots){
      for(var _i=0;_i<arrOvr.day1Slots;_i++) dayNums.push(1);
      for(var _i=0;_i<(n-1)*3;_i++) dayNums.push(Math.floor(_i/3)+2);
    } else {
      for(var _i=0;_i<shown.length;_i++) dayNums.push(Math.floor(_i/3)+1);
    }

    shown.forEach(function(a, i){
      var dayNum = dayNums[i] || Math.floor(i/3)+1;
      var cardDate = new Date(cityStartDate);
      cardDate.setDate(cityStartDate.getDate()+(dayNum-1));
      var dateLabel = fmt(cardDate);
      var st = getStatus(city, a.p);
      var rp = getRestaurantForCard(city, dayNum, a.slot);
      var roKey = city+'-'+a.p+'-rest';
      var savedRest = state.restaurantOverrides[roKey];

      var card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-'+city+'-'+a.p;

      // Accent bar
      var accent = document.createElement('div');
      accent.className = 'card-accent';
      accent.style.background = C[city].color;
      card.appendChild(accent);

      // Card top
      var cardTop = document.createElement('div');
      cardTop.className = 'card-top';
      cardTop.innerHTML = '<span class="day-pill" style="background:'+C[city].light+';color:'+C[city].dark+';">'
        var isFirstOfDay = (i===0) || (dayNums[i] !== dayNums[i-1]);
        cardTop.innerHTML = '<span class="day-pill" style="background:'+C[city].light+';color:'+C[city].dark+'">'
        +(isFirstOfDay?'Day '+dayNum+' \u00b7 ':'')+dateLabel+' \u00b7 '+a.slot+'</span>'
        +'<span class="cat-pill '+a.cat+'">'+a.cat+(a.aiGenerated?' ✨':'')+'</span>';
      card.appendChild(cardTop);

      // Title and desc
      var h3 = document.createElement('h3');
      h3.textContent = a.title;
      card.appendChild(h3);
      var p = document.createElement('p');
      p.textContent = a.desc;
      card.appendChild(p);
      if(a.tip){
        var tipDiv = document.createElement('div');
        tipDiv.className = 'tip';
        tipDiv.textContent = '💡 '+a.tip;
        card.appendChild(tipDiv);
      }

      // Restaurant pairing
      if(rp){
        var rb = document.createElement('div');
        rb.className = 'rest-box';
        rb.innerHTML = '<div class="rest-box-header">'
          +'<span style="font-size:12px;font-weight:700;color:#c2410c;">🍽 Eat nearby</span>'
          +(rp.markWiens?'<span class="mw-badge">📺 Mark Wiens</span>':'')
          +'</div>'
          +'<div class="rest-name">'+rp.name+'</div>'
          +'<div class="rest-dish">'+rp.dish+' · '+rp.area+'</div>'
          +'<div class="rest-tip">💡 '+rp.tip+'</div>';
        card.appendChild(rb);
      }

      // Saved restaurant override
      if(savedRest){
        var ro = document.createElement('div');
        ro.className = 'rest-override';
        ro.innerHTML = '<strong>📌 Your pick:</strong> '+savedRest;
        card.appendChild(ro);
      }

      // Edit the suggested restaurant OR add your own
      if(rp && !savedRest){
        var editRestBtn = document.createElement('button');
        editRestBtn.style.cssText = 'width:100%;margin-top:5px;padding:6px;background:none;border:1px dashed #fed7aa;border-radius:8px;font-size:11px;font-weight:600;color:#c2410c;cursor:pointer;font-family:Inter,sans-serif;';
        editRestBtn.textContent = '✏️ Edit this suggestion or add your own';
        editRestBtn.onclick = (function(ck,cp){return function(){openRestEditModal(ck,cp);};})(city,a.p);
        card.appendChild(editRestBtn);
      }

      // Add restaurant button
      var raBtn = document.createElement('button');
      raBtn.className = 'rest-add-btn';
      raBtn.textContent = savedRest ? '✏️ Change restaurant pick' : '📌 Add your own restaurant pick';
      raBtn.onclick = (function(ck, cp, cb){
        return function(){
          var existing = document.getElementById('ri-'+ck+'-'+cp);
          if(existing){existing.remove();return;}
          var row = document.createElement('div');
          row.className = 'rest-inp-row';
          row.id = 'ri-'+ck+'-'+cp;
          var ri = document.createElement('input');
          ri.type='text'; ri.placeholder='Restaurant name...';
          ri.value = state.restaurantOverrides[ck+'-'+cp+'-rest']||'';
          var rs = document.createElement('button');
          rs.className='rest-save-btn'; rs.textContent='Save';
          rs.onclick=function(){
            var v=ri.value.trim();
            if(v) state.restaurantOverrides[ck+'-'+cp+'-rest']=v;
            else delete state.restaurantOverrides[ck+'-'+cp+'-rest'];
            saveState(); renderSecs(); toast('Saved ✓');
          };
          row.appendChild(ri); row.appendChild(rs);
          cb.parentNode.insertBefore(row, cb.nextSibling);
          ri.focus();
        };
      })(city, a.p, raBtn);
      card.appendChild(raBtn);

      // Status row
      var srow = document.createElement('div');
      srow.className = 'srow';
      srow.innerHTML = '<span class="slbl">Mark:</span>';
      ['confirmed','maybe','skip'].forEach(function(s){
        var b = document.createElement('button');
        b.className = 'sbtn'+(st===s?' '+s:'');
        b.textContent = s==='confirmed'?'✓ In':s==='maybe'?'? Maybe':'✗ Skip';
        b.onclick = (function(city2,p2,s2){
          return function(){
            state.statuses[city2+'-'+p2]=s2;
            saveState();
            var c2=document.getElementById('card-'+city2+'-'+p2);
            if(c2) c2.querySelectorAll('.sbtn').forEach(function(x){x.className='sbtn';});
            this.className='sbtn '+s2;
            toast('Saved ✓');
          };
        })(city,a.p,s);
        srow.appendChild(b);
      });
      card.appendChild(srow);

      // AI suggest
      var aiBtn = document.createElement('button');
      aiBtn.className = 'ai-suggest-btn';
      aiBtn.textContent = '✨ Suggest something different';
      aiBtn.onclick = (function(c2,p2){return function(){openSuggestModal(c2,p2);};})(city,a.p);
      card.appendChild(aiBtn);

      // Edit button - lets user write their own activity
      var editBtn = document.createElement('button');
      editBtn.style.cssText = 'width:100%;margin-top:5px;padding:7px;background:none;border:1px dashed var(--border);border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;font-family:Inter,sans-serif;';
      editBtn.textContent = '✏️ Write my own activity';
      editBtn.onclick = (function(c2,p2){return function(){openEditModal(c2,p2);};})(city,a.p);
      card.appendChild(editBtn);

      div.appendChild(card);
    });

    if(dropped>0){
      var note = document.createElement('div');
      note.className='more-note';
      note.textContent='+ '+dropped+' more activities unlock if you add nights to '+city;
      div.appendChild(note);
    }
    container.appendChild(div);
  });

  // Bookings section
  renderBookings(container);
  renderLogistics(container);
  renderPacking(container);
  renderWeather(container);
  renderShare(container);
}

function renderBookings(container){
  var div = document.createElement('div');
  div.className='sec'+(state.activeTab==='bookings'?' active':'');
  div.id='sec-bookings';
  div.innerHTML='<div style="font-family:Playfair Display,serif;font-size:20px;color:var(--text);margin-bottom:4px;">📋 My Bookings</div>'
    +'<div style="font-size:13px;color:var(--text2);margin-bottom:14px;">Add confirmation details. AI will adjust your schedule to fit.</div>';
  BOOKINGS_DEF.forEach(function(b){
    var saved = state.bookings[b.id]||{};
    var isBooked = saved.conf && saved.conf.length>0;
    var card = document.createElement('div');
    card.className='book-card';
    var headerHtml='<div class="book-header"><span class="book-icon">'+b.icon+'</span>'
      +'<div><div class="book-title">'+b.title+'</div><div class="book-sub">'+b.sub+'</div></div>'
      +'<span class="book-status '+(isBooked?'booked':'pending')+'">'+(isBooked?'Booked ✓':'Pending')+'</span></div>';
    var fieldsHtml='<div class="field-row">';
    b.fields.forEach(function(f){
      fieldsHtml+='<div class="field"><label>'+f.label+'</label>'
        +'<input type="text" placeholder="'+f.placeholder+'" value="'+(saved[f.key]||'')+'" data-bid="'+b.id+'" data-key="'+f.key+'" onchange="saveBookingField(this.dataset.bid,this.dataset.key,this.value)"/></div>';
    });
    fieldsHtml+='</div>';
    card.innerHTML=headerHtml+fieldsHtml
      +'<button class="book-save-btn" onclick="saveBooking(this.dataset.bid)" data-bid="'+b.id+'">Save booking</button>'
      +(b.canAdjust?'<button class="book-ai-btn" onclick="adjustForBooking(this.dataset.bid)" data-bid="'+b.id+'">✨ Ask AI to adjust itinerary around this</button>':'');
    div.appendChild(card);
  });
  // Custom bookings
  var customs = JSON.parse(localStorage.getItem('glowup_custom_books')||'[]');
  if(customs.length>0){
    var ch=document.createElement('div');ch.style.cssText='font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 7px;';
    ch.textContent='Custom Bookings';div.appendChild(ch);
    customs.forEach(function(b,i){
      var card=document.createElement('div');card.className='book-card';
      card.innerHTML='<div class="book-header"><span class="book-icon">'+(b.icon||'🎟')+'</span>'
        +'<div><div class="book-title">'+b.title+'</div><div class="book-sub">'+b.city+' · '+b.date+'</div></div>'
        +'<span class="book-status '+(b.conf?'booked':'pending')+'">'+(b.conf?'Booked ✓':'Pending')+'</span></div>'
        +'<p style="font-size:13px;color:var(--text2);">'+b.details+'</p>'
        +'<button onclick="deleteCustomBook('+i+')" style="margin-top:8px;width:100%;padding:7px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;cursor:pointer;color:var(--text3);">Remove</button>';
      div.appendChild(card);
    });

// ── ARRIVAL ADJUSTMENT ────────────────────────────────────────────────────────
function parseHour(t){
  if(!t)return null;
  var m=t.trim().toUpperCase().match(/(\d{1,2}):?(\d{0,2})\s*(AM|PM)?/);
  if(!m)return null;
  var h=parseInt(m[1]),mn=parseInt(m[2]||0),ap=m[3];
  if(ap==='PM'&&h!==12)h+=12;if(ap==='AM'&&h===12)h=0;
  return h+mn/60;
}
async function adjustForBooking(id){
  var saved = state.bookings[id]||{};
  toggleAI(true);

  var arrivalMap = {
    'flight_yvr_icn':  'Seoul',
    'ktx_seoul_busan': 'Busan',
    'flight_pus_cju':  'Jeju',
    'flight_cju_tpe':  'Taipei',
  };

  var city = arrivalMap[id];
  if(city){
    var arrHour = parseHour(saved.arr);
    if(arrHour !== null){
      var day1Slots, desc;
      if(arrHour >= 17){
        day1Slots = 1;
        desc = 'just one evening activity - arrive, check in, easy dinner';
      } else if(arrHour >= 13){
        day1Slots = 2;
        desc = 'afternoon and evening only - morning is travel time';
      } else {
        day1Slots = 3;
        desc = 'a full day of activities';
      }
      state.arrivalOverrides[city] = {day1Slots: day1Slots};
      // Also handle departure from previous city
      if(id === 'ktx_seoul_busan'){
        var depH = parseHour(saved.dep);
        if(depH !== null) state.arrivalOverrides.Seoul_departure = {depHour: depH};
      } else if(id === 'flight_pus_cju'){
        var depH2 = parseHour(saved.dep);
        if(depH2 !== null) state.arrivalOverrides.Busan_departure = {depHour: depH2};
      } else if(id === 'flight_cju_tpe'){
        var depH3 = parseHour(saved.dep);
        if(depH3 !== null) state.arrivalOverrides.Jeju_departure = {depHour: depH3};
      }
      saveState();
      renderSecs();
      appendChat('aiLog','ai','Got it - you arrive in '+city+' at '+(saved.arr||'')+', so Day 1 shows '+desc+'. Adjusted! ');
      return;
    }
  }

  var details = Object.entries(saved).filter(function(e){return e[1];}).map(function(e){return e[0]+': '+e[1];}).join(', ');
  var def = BOOKINGS_DEF.find(function(b){return b.id===id;});
  appendChat('aiLog','ai','Looking at your booking...',true);
  try{
    var res = await callClaude('Booking: "'+def.title+'". Details: '+details+'. Current schedule: Seoul '+state.nights.Seoul+' nights, Busan '+state.nights.Busan+', Jeju '+state.nights.Jeju+', Taipei '+state.nights.Taipei+'. How does this affect daily activities? Give 2-3 specific warm concise suggestions.');
    document.querySelector('.chat-loading')?.remove();
    appendChat('aiLog','ai',res);
  }catch(e){
    document.querySelector('.chat-loading')?.remove();
    appendChat('aiLog','ai',e.message==='NO_KEY'?'Add your API key - tap the key icon above.':'Error: '+e.message.slice(0,60));
  }
}

function getAISystem(){
  var hoods=CITIES.map(function(c){return c+(state.hoods[c]?' (staying in '+state.hoods[c]+')':' (hood TBC)');}).join(', ');
  return 'You are a warm travel planner for the Glowup Asia trip: Mo (organizer, mid-40s), her sister, and their mom (older, low-impact activities). Sep 2025: '+hoods+'. Jeju has rental car. Priorities: skin treatments Seoul days 1-3, food, K-beauty shopping, mom-friendly. Keep answers warm, specific, concise. For activity suggestions return only valid JSON: {"title":"...","cat":"wellness|food|culture|shopping|nature","slot":"Morning|Afternoon|Evening","desc":"...","tip":"..."}';
}
async function callClaude(msg){
  var key=getApiKey();if(!key)throw new Error('NO_KEY');
  var res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:getAISystem(),messages:[{role:'user',content:msg}]})
  });
  if(!res.ok){var e=await res.json().catch(function(){return{};});throw new Error(e.error?.message||'API '+res.status);}
  var d=await res.json();return d.content[0].text;
}

async function suggestAlternative(city,priority,note){
  var activity=ACTIVITIES.find(function(a){return a.city===city&&a.p===priority;});

    +'<div style="font-size:12px;color:var(--text3);margin-bottom:12px;">Replacing: <strong>'+activity.title+'</strong></div>'
    +'<label style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px;">Title</label>'
    +'<input id="edit-title" class="modal-input" placeholder="Activity title" value="'+activity.title+'"/>'
    +'<label style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px;">Description</label>'
    +'<textarea id="edit-desc" class="modal-textarea" placeholder="What are you doing?">'+activity.desc+'</textarea>'
    +'<label style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px;">Tip (optional)</label>'
    +'<input id="edit-tip" class="modal-input" placeholder="Any useful tip or note" value="'+(activity.tip||'')+'"/>'
    +'<div class="mbtn-row">'
    +'<button class="mbtn-primary" id="editSaveBtn">Save activity</button>'
    +'<button class="mbtn-secondary" onclick="this.closest(\".modal-back\").remove()">Cancel</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(m);
  m.onclick = function(e){if(e.target===m)m.remove();};
  document.getElementById('editSaveBtn').onclick = function(){
    var title = document.getElementById('edit-title').value.trim();
    var desc  = document.getElementById('edit-desc').value.trim();
    var tip   = document.getElementById('edit-tip').value.trim();
    if(!title){alert('Please add a title');return;}
    activity.title = title;
    activity.desc  = desc;
    activity.tip   = tip;
    activity.aiGenerated = true; // mark as customised
    saveCustomActivities();
    m.remove();
    renderSecs();
    toast('Activity saved ✓');
  };
  setTimeout(function(){document.getElementById('edit-title').focus();},50);
}


// ── LIVE SYNC ─────────────────────────────────────────────────────────────────
var SYNC_URL = 'https://script.google.com/macros/s/AKfycbzxZ0MF_QmWxS11wIDA5j2ZbhNIO8aLyoiXomFE-xEGGGmHgsVf5itdIWXfJ6j31LcCLg/exec';

async function pushToSheet(){
  try{
    await fetch(SYNC_URL, {
      method:'POST',
      body: JSON.stringify(state),
      headers:{'Content-Type':'text/plain'}
    });
    updateSyncIndicator('pushed');
  }catch(e){
    updateSyncIndicator('error');
  }
}

async function pullFromSheet(){
  updateSyncIndicator('syncing');
  try{
    var res = await fetch(SYNC_URL + '?t=' + Date.now());
    var json = await res.json();
    if(json.status === 'ok' && json.data){
      var remote = JSON.parse(json.data);
      // Apply all remote state
      if(remote.nights) state.nights = remote.nights;
      if(remote.hoods)  state.hoods  = remote.hoods;
      if(remote.statuses) state.statuses = remote.statuses;
      if(remote.bookings) state.bookings = remote.bookings;
      if(remote.packing)  state.packing  = remote.packing;
      if(remote.restaurantOverrides) state.restaurantOverrides = remote.restaurantOverrides;
      if(remote.arrivalOverrides)    state.arrivalOverrides    = remote.arrivalOverrides;
      // Save to localStorage
      localStorage.setItem('glowup_v6', JSON.stringify(state));
      // Force complete re-render with a tiny delay to ensure DOM is ready
      setTimeout(function(){
        renderAlloc();
        renderTabs();
        renderSecs();
        updateSyncIndicator('pulled');
        toast('Pulled latest changes ✓');
      }, 100);
    } else {
      updateSyncIndicator('empty');
    }
  }catch(e){
    updateSyncIndicator('error');
    console.log('Pull error:', e);
  }
}

function updateSyncIndicator(status){
  var dot = document.getElementById('sdot');
  var lbl = document.getElementById('slbl');
  if(!dot||!lbl) return;
  var map = {
    'pushed':  ['#22c55e', 'Pushed ✓ — others will see your changes'],
    'pulled':  ['#22c55e', 'Pulled ✓ — you have the latest'],
    'syncing': ['#f59e0b', 'Syncing...'],
    'error':   ['#ef4444', 'Sync error — check connection'],
    'empty':   ['#9b86b0', 'No data in sheet yet — push first'],
    'live':    ['#22c55e', 'Ready to sync'],
  };
  var s = map[status]||map.live;
  dot.style.background = s[0];
  lbl.textContent = s[1];
}

function startSync(){
  updateSyncIndicator('live');
}



// ── BOOT ──────────────────────────────────────────────────────────────────────
function boot(){
  loadState();
  loadCustomActivities();
  updateKeyBtn();
  renderAlloc();
  renderTabs();
  renderSecs();
  updateSyncIndicator('live');
  // Always pull latest from sheet on load
  pullFromSheet();
  if(state.sheetId){
    var si=document.getElementById('sheetIn');
    if(si)si.value='https://docs.google.com/spreadsheets/d/'+state.sheetId;
    var sd=document.getElementById('sdot');if(sd)sd.style.background='#22c55e';
    var sl=document.getElementById('slbl');if(sl)sl.textContent='Connected';
  }
}
