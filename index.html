  {city:'Seoul',p:1, slot:'Morning',   cat:'wellness', title:'Skin treatment #1 — laser & booster',          desc:'Aesthetic clinic day — perfect timing while you\'re jet-lagged and want a low-key first day. Skin may need 24hr recovery but you\'re fully mobile for gentle walks.',                                              tip:'Book before the trip. Gangnam: JK Plastic Surgery, 365mc, Banobagi. Ask about combo laser + skin booster packages.'},
  {city:'Seoul',p:2, slot:'Afternoon', cat:'shopping',  title:'Neighbourhood walk + K-beauty aftercare haul', desc:'Gentle recovery afternoon. Wander your Seoul neighbourhood and stock up on post-treatment skincare at Olive Young — sheet masks, snail cream, Centella products. Perfect pace for a recovery day.',              tip:'Stay close to your accommodation today. Add your neighbourhood above and AI will suggest the best nearby Olive Young and cafés.'},
  {city:'Seoul',p:3, slot:'Evening',   cat:'wellness',  title:'Skin treatment #2 — follow-up session',        desc:'Second session or follow-up while skin is still settling. Stay close to your Seoul base — gentle walks only. By now you\'re sleeping better and feeling human again.',                                                                   tip:'Many clinics offer 2-session packages. Book both appointments before you leave Canada.'},
  {city:'Seoul',p:4, slot:'Morning', cat:'food',      title:'Gwangjang Market food tour',                   desc:'One of Seoul\'s oldest and most famous markets. Try bindaetteok (mung bean pancakes), kalguksu noodles, and mayak gimbap. Plenty of seated stalls — great for mom.',                                           tip:'Go mid-afternoon (3–4pm) to dodge the lunch rush. Most stalls are cash only.'},
  {city:'Seoul',p:5, slot:'Afternoon',   cat:'culture',   title:'Gyeongbokgung Palace + hanbok rental',          desc:'Seoul\'s grandest royal palace. Rent hanboks for free entry and stunning photos. Changing of the guard ceremony at 10am and 2pm. Flat and easy walking throughout.',                                           tip:'Book hanbok rental the day before. Arrive 30 min early — it gets crowded fast.'},
  {city:'Seoul',p:6, slot:'Evening', cat:'culture',   title:'Bukchon Hanok Village + Insadong',             desc:'Wander Bukchon\'s narrow preserved hanok streets with their centuries-old rooftiles, then down to Insadong for traditional souvenirs, teas, and street food. Mostly flat.',                                      tip:'Late afternoon has the best light for photos and fewer crowds than midday.'},
  {city:'Seoul',p:7, slot:'Morning',   cat:'culture',   title:'Changdeokgung Secret Garden',                   desc:'UNESCO World Heritage palace with a breathtaking private garden — lotus ponds, wooden pavilions, and ancient trees. Guided tour only, book in advance.',                                                         tip:'Book at cdg.go.kr at least 2 weeks ahead. English tours at 11:30am and 2:30pm.'},
  {city:'Seoul',p:8, slot:'Afternoon', cat:'shopping',  title:'Myeongdong street food + K-beauty megastores',  desc:'Seoul\'s most famous street for shopping and snacking. K-beauty megastores, street food stalls (hotteok, tteokbokki), and loads of affordable fashion.',                                                        tip:'Best in the evening when all the food stalls open. Olive Young flagship is here.'},
  {city:'Seoul',p:9, slot:'Evening',   cat:'shopping',  title:'Seongsu-dong + 5-floor flagship Olive Young',  desc:'Seoul\'s hippest creative district — artisan cafés, vintage boutiques, and the world\'s largest Olive Young for the full K-beauty haul. The dream.',                                                           tip:'Subway line 2 to Seongsu. Arrive when Olive Young opens (10am) to beat the crowds.'},
  {city:'Seoul',p:10,slot:'Morning', cat:'culture',   title:'N Seoul Tower + Namsan Park',                  desc:'Cable car up to Seoul\'s iconic tower for panoramic city views. Lovely gardens and walking paths at the base — no hiking required. Great for all three of you.',                                                 tip:'Go at sunset for the best views and golden-hour photos. Buy tickets online.'},
  {city:'Seoul',p:11,slot:'Afternoon',   cat:'wellness',  title:'Jjimjilbang spa day — Dragon Hill',             desc:'Traditional Korean bathhouse. Sauna rooms, body scrub (Italy towel), and relaxation lounges. A deeply restorative local experience that mom will love.',                                                        tip:'Dragon Hill Spa near Seoul Station is open 24 hrs. Great for a recovery rest day.'},
  {city:'Seoul',p:12,slot:'Evening', cat:'shopping',  title:'Ikseon-dong café hop + Korean photo booth',    desc:'Ikseon-dong\'s historic alleyways lined with creative cafés and specialty shops. End with a Korean photo booth session — a must-do trio memory.',                                                              tip:'Try salt bread at Soha Salt Pond. Photo booths are 2,000–4,000 KRW for a full strip.'},
  // BUSAN
  {city:'Busan',p:1, slot:'Morning',   cat:'culture',   title:'Gamcheon Culture Village',                      desc:'The iconic colourful hillside village built into the cliffs — painted houses, street art, murals, and tiny cafés. Go early for fewer crowds and better photos.',                                                 tip:'Confirm your Busan neighbourhood above for accurate travel times. The Little Prince statue is the most photographed spot.'},
  {city:'Busan',p:2, slot:'Afternoon',   cat:'culture',   title:'Haedong Yonggungsa Seaside Temple',             desc:'Stunning Buddhist temple perched right on the coastal cliffs with dramatic ocean views. One of Korea\'s most beautiful temples — completely unique setting.',                                                     tip:'Best in morning light. Take a taxi or join a guided highlights tour from central Busan.'},
  {city:'Busan',p:3, slot:'Evening', cat:'nature',    title:'Busan Sky Capsule coastal ride',                desc:'Private glass capsule ride along a coastal track above the ocean. Stunning sea views, and since you pay for seats not capsules, you get the whole pod to yourselves.',                                            tip:'Pre-book online — sells out fast. Board at Cheongsapo station for shorter queues.'},
  {city:'Busan',p:4, slot:'Morning',   cat:'nature',    title:'Haeundae Beach sunset + Gwangan Bridge lights', desc:'Walk Haeundae Beach at golden hour then watch the iconic Gwangan Bridge light up at night. Flat promenade — a perfect gentle evening out with mom.',                                                           tip:'Best from 6pm. Korean fried chicken or fresh seafood at a beachside restaurant after.'},
  {city:'Busan',p:5, slot:'Afternoon',   cat:'food',      title:'Jagalchi Fish Market seafood experience',       desc:'Korea\'s largest fish market. Choose live seafood from tanks downstairs, have it prepared and served upstairs. An extraordinary experience unlike anything at home.',                                            tip:'Go 9–10am. Even if mom isn\'t a big seafood person, watching the market in action is magic.'},
  {city:'Busan',p:6, slot:'Evening', cat:'food',      title:'BIFF Square + ssiat hotteok food market',       desc:'Busan\'s film culture hub with a surrounding street food market. Best place in Korea to try ssiat hotteok — Busan\'s famous seed-filled sweet pancakes.',                                                       tip:'There\'s always a queue for ssiat hotteok — it\'s worth every minute. Very flat and walkable.'},
  {city:'Busan',p:7, slot:'Morning',   cat:'nature',    title:'Gwangalli Beach morning walk + café',           desc:'Quieter and more local than Haeundae. Beautiful views of the Diamond Bridge, great oceanfront cafés, and a peaceful pace — ideal for a slow morning with mom.',                                               tip:'Great option for your last Busan morning before flying to Jeju.'},
  {city:'Busan',p:8, slot:'Afternoon',   cat:'food',      title:'Korean BBQ dinner in Seomyeon',                 desc:'Tabletop Korean BBQ — grill your own meat, wrap in lettuce with banchan sides. An essential Korean meal, and Seomyeon is full of excellent options at every price point.',                                     tip:'Try dwaeji gukbap (Busan\'s famous pork rice soup) for lunch. Save appetite for BBQ.'},
  {city:'Busan',p:9, slot:'Evening', cat:'shopping',  title:'Shinsegae Centum City — world\'s largest store', desc:'Shopping, food court, ice rink, cinema, and Spa Land under one enormous roof. Worth visiting just to experience the sheer scale of it.',                                                                    tip:'Spa Land inside Shinsegae is excellent for a pamper session — budget an afternoon.'},
  // JEJU
  {city:'Jeju',p:1,  slot:'Morning',   cat:'nature',    title:'Seongsan Ilchulbong — Sunrise Peak',            desc:'UNESCO-listed volcanic crater on the eastern tip of Jeju. 45-min hike up stone steps for breathtaking 360° ocean views from inside the ancient crater rim.',                                                  tip:'Drive east from Seogwipo ~45 min. Combine with the haenyeo diver demo at 2pm nearby.'},
  {city:'Jeju',p:2,  slot:'Afternoon', cat:'culture',   title:'Haenyeo women diver demonstration',             desc:'Watch Jeju\'s legendary female freedivers surface from depth with their catch. A disappearing tradition — deeply cultural and genuinely moving to witness.',                                                    tip:'Shows at 1:30pm and 3:30pm near Seongsan. Seated viewing area — perfect for mom.'},
  {city:'Jeju',p:3,  slot:'Evening',   cat:'nature',    title:'Manjanggul Lava Tube cave',                     desc:'Asia\'s longest lava tube — a vast underground cave carved by ancient volcanic eruptions. Flat walking path, spectacular rock formations, and a cool 18°C inside.',                                            tip:'Bring a light layer — it\'s genuinely cold in the cave. The 7.6m lava column is incredible.'},
  {city:'Jeju',p:4,  slot:'Morning', cat:'nature',    title:'Hyeopjae Beach swim + coastal drive',           desc:'Jeju\'s most beautiful beach — white sand and brilliant turquoise shallows. Perfect for a swim or just sitting with feet in the water. September water is still warm.',                                        tip:'Much quieter than peak summer. Drive the scenic north coast back to Seogwipo after.'},
  {city:'Jeju',p:5,  slot:'Afternoon',   cat:'nature',    title:'Cheonjiyeon Waterfall',                         desc:'Easy flat walk from Seogwipo to a beautiful 22m waterfall surrounded by subtropical forest. Zero elevation change — completely accessible for mom.',                                                            tip:'5 min flat walk from the car park. Combine with Jeongbang Waterfall in the same afternoon.'},
  {city:'Jeju',p:6,  slot:'Evening', cat:'nature',    title:'Jeongbang Waterfall — falls into the sea',      desc:'A 23m waterfall that cascades directly into the ocean — the only waterfall in Asia to do so. Sit on the rocks and watch the sea spray.',                                                                        tip:'2,000 KRW entry. Combine with Cheonjiyeon — both in central Seogwipo.'},
  {city:'Jeju',p:7,  slot:'Morning',   cat:'nature',    title:'Daepo Jusangjeolli Cliffs',                     desc:'Dramatic hexagonal basalt columns formed when ancient lava hit the sea. Flat viewing bridges and paths along the cliff edge. Visually stunning and very accessible.',                                          tip:'15 min drive west of Seogwipo. Walk to Jungmun beach after for lunch.'},
  {city:'Jeju',p:8,  slot:'Afternoon', cat:'culture',   title:'Jeju Arte Museum — immersive digital art',      desc:'Korea\'s largest media art museum in a converted factory space. Massive digitally projected exhibitions. Air-conditioned and completely flat — ideal rest-day option.',                                         tip:'Perfect for a hot afternoon or if the weather turns rainy.'},
  {city:'Jeju',p:9,  slot:'Evening',   cat:'nature',    title:'Olle Trail short coastal walk',                 desc:'Pick a 2–3 hr segment of Jeju\'s famous 437km coastal trail near Seogwipo. Stunning sea views, gentle terrain — the perfect pace for a trio morning walk.',                                                   tip:'Trail 6 near Seogwipo is the most scenic and flattest. Download the Jeju Olle app.'},
  {city:'Jeju',p:10, slot:'Morning', cat:'food',      title:'Seogwipo Maeil Olle local market',             desc:'A small, local market with fresh Jeju produce — hallabong oranges, tangerine sweets, black pork snacks, and local gifts. Much more authentic than tourist markets.',                                          tip:'Great for picking up Jeju gifts and snacks. 20 min bus from central Seogwipo.'},
  // TAIPEI
  {city:'Taipei',p:1, slot:'Morning',  cat:'culture',   title:'National Palace Museum',                        desc:'One of the world\'s truly great museums — 800,000 artefacts including the famous jade cabbage and jade pork belly. Fully air-conditioned with plenty of seating.',                                             tip:'MRT to Shilin then bus 255. Follow the thematic route — it keeps the visit focused and manageable.'},
  {city:'Taipei',p:2, slot:'Afternoon',cat:'food',      title:'Shilin Night Market',                           desc:'Taipei\'s most famous night market. Dozens of food stalls, carnival games, and shopping stalls. Best experienced in the evening with lots of seated eating options.',                                           tip:'Try oyster omelette, scallion pancakes, xiaolongbao, and bubble tea. Come genuinely hungry.'},
  {city:'Taipei',p:3, slot:'Evening',  cat:'culture',   title:'Chiang Kai-shek Memorial Hall',                 desc:'Grand public square with stunning traditional architecture and peaceful gardens. Locals practice tai chi in the mornings. Changing of the guard ceremony every hour.',                                           tip:'Free entry. Go on a weekday morning for the tai chi atmosphere. Very calm and beautiful.'},
  {city:'Taipei',p:4, slot:'Morning',  cat:'shopping',  title:'Ximending walking district',                    desc:'The Harajuku of Taipei — shopping, bubble tea, street food, and incredible street art all in one flat, very walkable district. Great for all three of you.',                                                   tip:'Din Tai Fung is nearby — legendary soup dumplings that mom will absolutely love.'},
  {city:'Taipei',p:5, slot:'Afternoon',cat:'nature',    title:'Elephant Mountain hike + Taipei 101',           desc:'An easy 20–30 min staircase climb to the iconic free viewpoint of Taipei 101 from above. Then go up inside Taipei 101 itself for full 360° city views.',                                                       tip:'Take it slow for mom — it\'s just steps, nothing technical. Buy 101 tickets online.'},
  {city:'Taipei',p:6, slot:'Evening',  cat:'food',      title:'Raohe Street Night Market',                     desc:'Smaller and more local than Shilin. Famous for its pepper pork buns at the temple stall — one of the best bites in all of Taiwan.',                                                                             tip:'The temple entrance pepper pork bun queue is always worth the wait.'},
  {city:'Taipei',p:7, slot:'Morning',  cat:'shopping',  title:'Dihua Street — historic market + gifts',        desc:'Taipei\'s oldest and most beautiful street — Baroque shophouses selling traditional goods, packaged teas, and Taiwanese souvenirs. The best place to buy gifts.',                                             tip:'Buy pineapple cakes and nougat here — far better quality than the airport shops.'},
  {city:'Taipei',p:8, slot:'Afternoon',cat:'culture',   title:'Day trip: Jiufen Old Street',                   desc:'The magical hillside gold-rush village that partly inspired Spirited Away. Narrow lantern-lit lanes, tea houses with sea views, and incredible atmosphere at dusk.',                                           tip:'Go on a weekday. Tea houses have seating — perfect rest stops for mom. Best at sunset.'},
  {city:'Taipei',p:9, slot:'Evening',  cat:'nature',    title:'Day trip: Yehliu Geopark',                      desc:'Extraordinary coastal rock formations including the famous Queen\'s Head rock. Flat boardwalk along the whole coast — very accessible and visually unlike anything else.',                                     tip:'Can combine with Jiufen on the same day — both on the same bus route north of Taipei.'},
  {city:'Taipei',p:10,slot:'Morning',  cat:'wellness',  title:'Beitou hot spring village',                     desc:'Hot spring resort area 30 min from central Taipei by MRT. Traditional bathhouses, steaming thermal valleys, and mountain scenery. A lovely restorative afternoon.',                                            tip:'Private baths are available for just the three of you. Check renovation status before going.'},
  {city:'Taipei',p:11,slot:'Afternoon',cat:'food',      title:'Din Tai Fung flagship — soup dumplings',        desc:'The legendary Taipei original. Watch dumplings being hand-made through the glass kitchen, then eat the best xiaolongbao of your life. A genuine bucket-list meal.',                                           tip:'Weekday morning to avoid the longest waits. Worth every minute of any queue.'},
  {city:'Taipei',p:12,slot:'Evening',  cat:'shopping', title:'Eslite Spectrum bookstore + night shopping', desc:"Taipei's most beautiful underground shopping street connects MRT stations with boutiques, cafes, and the famous 24-hour Eslite Spectrum bookstore — a stunning architectural space worth visiting even if you don't buy anything.", tip:"Eslite Spectrum Songyan store is the most impressive. Great air-conditioned afternoon activity on a hot or rainy day.", status:'confirmed'},
  {city:'Taipei',p:13,slot:'Morning',  cat:'food',     title:'Gongguan morning breakfast near NTU',              desc:"A smaller, student-oriented night market with excellent cheap bites — scallion pancakes, stinky tofu, Taiwanese sausage, and fresh fruit drinks. Much less crowded than Shilin.", tip:"Take MRT to Gongguan station. Very flat and walkable. A great alternative to the bigger tourist night markets.", status:'confirmed'},
  {city:'Taipei',p:14,slot:'Afternoon',cat:'culture',  title:'Longshan Temple and Bopiliao Historic Block',        desc:"Longshan Temple is Taipei's most atmospheric temple — incense smoke, chanting, and intricate gold architecture. Nearby Bopiliao is a preserved Qing dynasty street with galleries and local cafes.", tip:"Go in late afternoon for the best golden light. Free entry to both. Flat and easy walking — perfect for mom.", status:'confirmed'},
  {city:'Taipei',p:15,slot:'Evening',  cat:'food',     title:'Final night — Da-an dinner and bubble tea crawl',         desc:"A relaxed evening close to home in Da-an — excellent local restaurants, bubble tea shops, and a gentle evening walk through Da-an Forest Park as locals gather for their evening routines.", tip:"Da-an has fantastic neighbourhood restaurants. Ask your hotel for their current favourite — locals know best.", status:'confirmed'},
  // ── SEOUL extra activities (p:16-27 for up to 9 nights) ──────────────────
  {city:'Seoul',p:16,slot:'Morning',  cat:'culture', title:'Gyeonghuigung Palace (lesser-known gem)',desc:"One of Seoul's five grand palaces but far less crowded than Gyeongbokgung. Beautiful grounds, excellent photo opportunities, and peaceful atmosphere — ideal for a relaxed morning.",tip:"5 min walk from Seoul Station area. Free entry. Combine with a walk through the nearby Seodaemun neighbourhood.",status:'confirmed'},
  {city:'Seoul',p:17,slot:'Afternoon',cat:'shopping',title:'Garosu-gil boutique street in Gangnam',desc:"Tree-lined boulevard in Gangnam lined with independent boutiques, concept stores, cafés, and galleries. Seoul's most stylish shopping street — less commercial than Myeongdong, more curated.",tip:"Take subway line 3 to Sinsa station. Best on a weekday afternoon when it's less crowded.",status:'confirmed'},
  {city:'Seoul',p:18,slot:'Evening',  cat:'food',    title:'Itaewon international food night',desc:"Seoul's most cosmopolitan neighbourhood — incredible variety from Korean fried chicken to Lebanese mezze to craft cocktails. Great for a night when the group wants something different from Korean food.",tip:"Itaewon main strip plus Gyeongnidan-gil side street have the best options. Very lively on weekday evenings.",status:'confirmed'},
  {city:'Seoul',p:19,slot:'Morning',  cat:'culture', title:'National Folk Museum of Korea',desc:"Located inside Gyeongbokgung Palace grounds — an excellent outdoor and indoor museum showing traditional Korean life, costumes, and customs. Completely flat and very accessible.",tip:"Free entry with palace ticket. Excellent English signage. Great for mom — lots of seating and interesting displays.",status:'confirmed'},
  {city:'Seoul',p:20,slot:'Afternoon',cat:'wellness',title:'Korean facial at a skincare clinic',desc:"Follow-up skincare session or a gentler facial treatment — hydration mask, LED therapy, or oxygen facial. Perfect mid-trip skin top-up while the laser results are settling.",tip:"Many walk-in clinics in Myeongdong and Gangnam offer same-day appointments. Budget 80,000-150,000 KRW.",status:'confirmed'},
  {city:'Seoul',p:21,slot:'Evening',  cat:'culture', title:'Cheonggyecheon Stream evening walk',desc:"Beautiful urban stream running through central Seoul, lit up at night with colourful lanterns and light installations. Flat walking path below street level — calm and very scenic.",tip:"Enter at Gwanggyo Bridge near City Hall. Walk east for about 2km. Great way to end a full day.",status:'confirmed'},
  {city:'Seoul',p:22,slot:'Morning',  cat:'shopping',title:'Namdaemun Market morning visit',desc:"One of Korea's largest traditional markets — clothing, food, accessories, and imported goods at wholesale prices. Opens at 6am. A completely different vibe from the modern shopping districts.",tip:"Go early (7-8am) for the full traditional market experience. Great for affordable gifts and Korean snacks.",status:'confirmed'},
  {city:'Seoul',p:23,slot:'Afternoon',cat:'culture', title:'Deoksugung Palace and Stone Wall Road',desc:"A smaller palace in the heart of modern Seoul, surrounded by art museums and the famous Deoksugung Doldam-gil (Stone Wall Road) — one of the most romantic walks in the city.",tip:"Changing of the guard at 11am, 2pm, and 3:30pm. The stone wall road is especially beautiful in afternoon light.",status:'confirmed'},
  {city:'Seoul',p:24,slot:'Evening',  cat:'food',    title:'Pojangmacha street food tent experience',desc:"Traditional Korean street food tents — red vinyl, plastic stools, tteokbokki, sundae (Korean blood sausage), and soju. A quintessential late-evening Seoul experience.",tip:"Found all over the city at night — especially around Jongno and Dongdaemun. Very affordable and very local.",status:'confirmed'},
  {city:'Seoul',p:25,slot:'Morning',  cat:'nature',  title:'Olympic Park morning walk',desc:"Huge green park in eastern Seoul with outdoor sculptures, cycling paths, and peaceful gardens. Very popular with locals for morning exercise. Flat and extremely accessible for mom.",tip:"Take subway line 5 to Olympic Park station. The rose garden is beautiful in September.",status:'confirmed'},
  {city:'Seoul',p:26,slot:'Afternoon',cat:'culture', title:'Seoul Museum of Art (SeMA)',desc:"Free contemporary art museum near Deoksugung Palace with excellent rotating exhibitions. Air-conditioned, modern, and very accessible. Often features Korean and international contemporary artists.",tip:"Free entry. Closed Mondays. Combine with Deoksugung Palace next door for a full cultural afternoon.",status:'confirmed'},
  {city:'Seoul',p:27,slot:'Evening',  cat:'food',    title:'Final Seoul dinner — hanwoo beef experience',desc:"Splurge on a proper hanwoo (Korean premium beef) dinner for your last night in Seoul. Melt-in-your-mouth marbling, multiple cuts, and traditional banchan. A fitting farewell to the city.",tip:"Woo Lae Oak (우래옥) or Maple Tree House are celebrated options. Book in advance. Budget 80,000-120,000 KRW/person.",status:'confirmed'},

  // ── BUSAN extra activities (p:10-18 for up to 6 nights) ─────────────────
  {city:'Busan',p:10,slot:'Morning',  cat:'culture', title:'Beomeosa Temple mountain hike',desc:"One of Korea's great mountain temples, nestled in the forested slopes of Geumjeongsan mountain. A beautiful morning escape from the city with traditional architecture and mountain air.",tip:"Take subway line 1 to Beomeosa station, then bus to the temple. Wear comfortable shoes — gentle uphill path.",status:'confirmed'},
  {city:'Busan',p:11,slot:'Afternoon',cat:'nature',  title:'Taejongdae cliffs and lighthouse',desc:"Dramatic coastal cliffs at the southern tip of Busan with a small train (Danubi) that loops around the headland. Stunning sea views, lighthouse, and a natural rock arch called Yeong Island.",tip:"Take the Danubi tourist train (~3,000 KRW) if mom finds the walk too long. Go in the afternoon for the best light.",status:'confirmed'},
  {city:'Busan',p:12,slot:'Evening',  cat:'food',    title:'Millak Waterside Park raw fish restaurants',desc:"A cluster of fresh seafood restaurants right on the water near Gwangalli Beach — order a raw fish platter (hoe) and eat with a direct view of the Diamond Bridge lit up at night.",tip:"Any of the restaurants in the complex work well. Budget ~40,000-60,000 KRW for a full seafood spread for 3.",status:'confirmed'},
  {city:'Busan',p:13,slot:'Morning',  cat:'shopping',title:'Gukje Market (international market)',desc:"Busan's largest traditional market — a labyrinth of stalls selling clothing, accessories, street food, and household goods. Less touristy than Nampo-dong but full of local character.",tip:"Best in the morning before 11am. Right near BIFF Square so easy to combine. Great for affordable souvenirs.",status:'confirmed'},
  {city:'Busan',p:14,slot:'Afternoon',cat:'culture', title:'UN Memorial Cemetery',desc:"The only UN cemetery in the world — a beautifully maintained garden cemetery honouring soldiers from 16 nations who died in the Korean War. Peaceful, moving, and historically significant.",tip:"Free entry. Flat and fully accessible. Takes about 45 minutes to walk through respectfully.",status:'confirmed'},
  {city:'Busan',p:15,slot:'Evening',  cat:'culture', title:'Busan Cinema Center at night',desc:"The striking BIFF (Busan International Film Festival) cinema complex designed by Coop Himmelblau — an architectural marvel with the world's largest cantilevered roof, dramatically lit at night.",tip:"Free to walk around the exterior. If a screening is on, attending is a great evening option. Near Centum City.",status:'confirmed'},
  {city:'Busan',p:16,slot:'Morning',  cat:'nature',  title:'Igidae Coastal Walk',desc:"A stunning 4.7km coastal path along Busan's southern cliffs — dramatic rock formations, sea spray, and panoramic ocean views. Much less crowded than the main tourist spots.",tip:"Moderate walk with some steps but very manageable. Take a taxi to the Oryukdo Skywalk end and walk back.",status:'confirmed'},
  {city:'Busan',p:17,slot:'Afternoon',cat:'shopping',title:'Seomyeon underground shopping mall',desc:"A huge underground mall beneath Seomyeon with hundreds of small boutiques selling affordable Korean fashion, cosmetics, and accessories. Great for a rainy afternoon or heat escape.",tip:"Right beneath your hotel area. Cash preferred at most stalls. Great for affordable K-fashion finds.",status:'confirmed'},
  {city:'Busan',p:18,slot:'Evening',  cat:'food',    title:'Grilled eel (jangeo-gui) dinner',desc:"Grilled freshwater eel is a Busan specialty rarely highlighted in tourist guides — rich, smoky, and served with multiple banchan sides. A local favourite for a special dinner.",tip:"Ask your hotel to recommend a local jangeo-gui restaurant. Budget ~35,000-45,000 KRW per person.",status:'confirmed'},

  // ── JEJU extra activities (p:11-21 for up to 7 nights) ──────────────────
  {city:'Jeju',p:11,slot:'Morning',  cat:'nature',  title:'Seopjikoji coastal walk',desc:"A stunning volcanic headland on the east coast with a lighthouse, wildflower meadows, and dramatic cliff views. Completely flat and very peaceful — one of Jeju's most beautiful hidden spots.",tip:"Near Seongsan — combine with Sunrise Peak on the same day. Best in the morning when the light is golden.",status:'confirmed'},
  {city:'Jeju',p:12,slot:'Afternoon',cat:'culture', title:'Jeju Stone Park (Jeju Dolhareubang Museum)',desc:"Outdoor sculpture park featuring Jeju's iconic dolhareubang (stone grandfather) statues in a beautiful natural setting. Very accessible, flat paths, and genuinely interesting cultural context.",tip:"Located near Jeju City. Easy driving distance. About 1.5 hours to walk through at a relaxed pace.",status:'confirmed'},
  {city:'Jeju',p:13,slot:'Evening',  cat:'food',    title:'Hallabong tangerine farm visit and dinner',desc:"Visit a Jeju tangerine farm at harvest time (September is early season) and eat freshly picked hallabong oranges. Then find a local haemultang restaurant nearby for a spicy seafood dinner.",tip:"Several farm stays and pick-your-own farms near Seogwipo open in September. Call ahead to confirm.",status:'confirmed'},
  {city:'Jeju',p:14,slot:'Morning',  cat:'nature',  title:'Bijarim Forest walk (nutmeg forest)',desc:"A hauntingly beautiful ancient forest of 2,800 nutmeg trees, some over 800 years old. A completely unique walking experience on Jeju — cool, fragrant, and utterly peaceful.",tip:"Located in central Jeju, 30 min drive from Seogwipo. Flat forest path, about 1 hour to walk through.",status:'confirmed'},
  {city:'Jeju',p:15,slot:'Afternoon',cat:'nature',  title:'Yeomiji Botanical Garden',desc:"A large indoor and outdoor botanical garden showcasing tropical and subtropical plants. The glass dome greenhouse is spectacular. Very flat and accessible — perfect for a relaxed afternoon.",tip:"Located in Jungmun resort area near Seogwipo. Allow 2 hours. Mom will love the orchid greenhouse.",status:'confirmed'},
  {city:'Jeju',p:16,slot:'Evening',  cat:'food',    title:'Abalone porridge (jeonbok-juk) dinner',desc:"Jeju abalone porridge is one of the island's most iconic dishes — creamy, rich, and deeply flavourful. Traditionally eaten as a health food, it's become a Jeju signature.",tip:"Several dedicated jeonbok-juk restaurants in Seogwipo. Budget ~20,000-30,000 KRW per bowl. Very gentle on the stomach.",status:'confirmed'},
  {city:'Jeju',p:17,slot:'Morning',  cat:'culture', title:'Jeju Folk Village Museum',desc:"A large open-air museum recreating traditional Jeju village life with original houses, tools, and demonstrations. Fascinating cultural context for everything you've seen on the island.",tip:"Located on the east coast near Seongsan. Allow 2 hours. Flat paths throughout — very accessible.",status:'confirmed'},
  {city:'Jeju',p:18,slot:'Afternoon',cat:'nature',  title:'Udo Island day trip',desc:"A tiny island off the northeast tip of Jeju reachable by a 15-minute ferry. Beautiful beaches, peanut ice cream, and a completely different pace from the main island.",tip:"Ferry from Seongsan Port every 30 min (~3,000 KRW). Rent an electric scooter or bicycle on arrival to see the whole island.",status:'confirmed'},
  {city:'Jeju',p:19,slot:'Evening',  cat:'culture', title:'Jeju Loveland sculpture park at night',desc:"An adult-themed outdoor sculpture park that's actually hilarious and surprisingly artistic. Open late — a fun, unexpected, and memorable evening option on Jeju.",tip:"Near Jeju City. Open until 10pm. ~12,000 KRW entry. Genuinely funny and memorable — a different side of Jeju.",status:'confirmed'},
  {city:'Jeju',p:20,slot:'Morning',  cat:'nature',  title:'Samdal Beach and Hamdeok Beach',desc:"Two of Jeju's most beautiful north coast beaches — crystal clear turquoise water and white sand. Hamdeok in particular has excellent cafés right on the beach.",tip:"30-40 min drive from Seogwipo. September water is still warm. Much less crowded than Hyeopjae.",status:'confirmed'},
  {city:'Jeju',p:21,slot:'Afternoon',cat:'wellness',title:'Healing stay at a Jeju spa resort',desc:"Jeju has several world-class wellness resorts offering day spa access — hot spring baths, herbal treatments, and ocean views. A perfect final afternoon before leaving the island.",tip:"Shinhwa World Spa or the Haevichi Hotel spa are excellent options. Book ahead. Budget 80,000-150,000 KRW.",status:'confirmed'},

  // ── TAIPEI extra activities (p:16-24 for up to 8 nights) ────────────────
  {city:'Taipei',p:16,slot:'Morning',  cat:'culture', title:'Xingtian Temple morning ritual',desc:"One of Taipei's most active temples — devotees arrive early to make offerings and have fortunes told. A living, breathing temple experience very different from the tourist-facing ones.",tip:"MRT to Xingtian Temple station. Go before 9am to see the most active worship. Free entry, very accessible.",status:'confirmed'},
  {city:'Taipei',p:17,slot:'Afternoon',cat:'shopping',title:'Guanghua Digital Plaza and electronics market',desc:"Taipei's famous electronics district — multiple floors of gadgets, phone accessories, cameras, and tech at competitive prices. Fun to browse even if you don't buy anything.",tip:"MRT to Zhongxiao Xinsheng station. The basement floors have the best deals. Great for cables, adapters, and phone cases.",status:'confirmed'},
  {city:'Taipei',p:18,slot:'Evening',  cat:'food',    title:'Tamsui riverside evening and old street',desc:"A charming riverside town at the end of the MRT red line — sunset over the water, a pedestrian old street with street food, and a completely different pace from central Taipei.",tip:"35 min from central Taipei on MRT. Arrive by 5pm for the sunset. Try the iron egg (tiě dàn) and fish balls.",status:'confirmed'},
  {city:'Taipei',p:19,slot:'Morning',  cat:'nature',  title:'Maokong Gondola and tea plantation',desc:"A scenic gondola ride into the Maokong hills, home to Taipei's tea-growing region. Visit a traditional tea house, taste freshly brewed oolong, and enjoy panoramic city views.",tip:"Take MRT to Taipei Zoo then gondola up. The gondola has glass-floor cabins for spectacular views. Book early.",status:'confirmed'},
  {city:'Taipei',p:20,slot:'Afternoon',cat:'culture', title:'Taipei Fine Arts Museum',desc:"Taipei's premier contemporary art museum in a striking modernist building near the Grand Hotel. Excellent rotating exhibitions of Taiwanese and international contemporary art.",tip:"MRT to Yuanshan station. Free first Sunday of each month. Air-conditioned and very accessible for mom.",status:'confirmed'},
  {city:'Taipei',p:21,slot:'Evening',  cat:'food',    title:'Huaxi Street Night Market (Snake Alley)',desc:"One of Taipei's oldest and most unusual night markets — traditionally known for snake wine and exotic foods, now a neighbourhood market with seafood, local snacks, and street performers.",tip:"MRT to Longshan Temple then short walk. More local than Shilin. The seafood stalls have excellent fresh oysters.",status:'confirmed'},
  {city:'Taipei',p:22,slot:'Morning',  cat:'culture', title:'Presidential Office Building and surrounding square',desc:"Taiwan's presidential office in a stunning Japanese colonial building — the surrounding boulevard is beautiful for a morning walk. Free guided tours available on weekdays.",tip:"MRT to NTU Hospital station. Free entry with passport on weekday mornings. Book guided tour in advance.",status:'confirmed'},
  {city:'Taipei',p:23,slot:'Afternoon',cat:'wellness',title:'Beitou hot spring day spa',desc:"Taiwan's most famous hot spring resort area — a short MRT ride from central Taipei with traditional Japanese-style bathhouses, thermal streams, and mountain scenery.",tip:"MRT to Xinbeitou station. The Millennium Hot Spring has large public pools (~40 TWD). Private pools also available.",status:'confirmed'},
  {city:'Taipei',p:24,slot:'Evening',  cat:'food',    title:'RAW restaurant or top Taiwanese fine dining',desc:"If budget allows, RAW by chef André Chiang is one of Asia's most celebrated restaurants — modern Taiwanese cuisine in a stunning space. Book months ahead for a truly special final dinner.",tip:"Book at raw.com.tw — reservations open 30 days ahead and fill instantly. ~2,500-3,500 TWD/person. Worth every dollar.",status:'confirmed'},
];
